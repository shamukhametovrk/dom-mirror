<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>dom-mirror</title>
  <link rel="stylesheet" href="/rrweb.css" />
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; background: #fff; }
    #bar { height: 40px; display: flex; gap: 6px; align-items: center; padding: 0 8px; background: #f1f3f4; border-bottom: 1px solid #ddd; box-sizing: border-box; }
    #bar > button { height: 28px; min-width: 32px; border: 1px solid #ccc; border-radius: 6px; background: #fff; cursor: pointer; }
    #tabs { flex: 1; display: flex; gap: 4px; min-width: 0; overflow: hidden; }
    .tab { display: flex; align-items: center; gap: 4px; min-width: 0; max-width: 200px; height: 30px; padding: 0 12px;
      border-radius: 8px; font-size: 13px; color: #3c4043; cursor: pointer; box-sizing: border-box; user-select: none; }
    .tab:hover { background: #e3e5e8; }
    .tab.active { background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / .15); font-weight: 600; }
    .tab .title { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .tab .close { border: 0; background: transparent; border-radius: 50%; width: 20px; height: 20px; line-height: 18px; padding: 0; cursor: pointer; color: #5f6368; font-size: 14px; }
    .tab .close:hover { background: #d3d6db; }
    #stage.dragging::after { content: "Отпустите, чтобы прикрепить"; position: absolute; inset: 8px; display: grid; place-items: center;
      border: 2px dashed #1a73e8; border-radius: 12px; background: rgb(26 115 232 / .08); color: #1a73e8; font-size: 18px; pointer-events: none; }
    #status { font-size: 12px; color: #888; min-width: 70px; text-align: right; }
    #logout { font-size: 12px; color: #5f6368; text-decoration: none; padding: 0 4px; }
    #stage { position: absolute; top: 40px; left: 0; right: 0; bottom: 0; overflow: hidden; }
    #player { position: absolute; inset: 0; }
    #player .replayer-wrapper { position: absolute; top: 0; left: 0; }
    #player iframe { border: 0; }
    #player .replayer-mouse { display: none; }   /* курсор рисует сам браузер пользователя */
    /* прозрачный слой поверх копии: ловит мышь и клавиатуру и отправляет на сервер */
    #overlay { position: absolute; inset: 0; outline: none; }
    #replaced { position: fixed; inset: 0; display: none; place-items: center; background: rgb(255 255 255 / .92); z-index: 10; text-align: center; }
    #replaced.shown { display: grid; }
    #replaced p { margin: 0 0 14px; font-size: 16px; color: #3c4043; }
    #toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 5; max-width: calc(100% - 32px); }
    .toast { background: #323232; color: #fff; padding: 10px 14px; border-radius: 8px; font-size: 13px; box-shadow: 0 2px 8px rgb(0 0 0 / .3); overflow-wrap: anywhere; }
    .toast.failed { background: #b3261e; }
    .toast a { color: #8ab4f8; margin-left: 10px; }
    .toast.clickable { cursor: pointer; text-decoration: underline; }
    #replaced button { height: 36px; padding: 0 18px; border: 0; border-radius: 8px; background: #1a73e8; color: #fff; font-size: 14px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="bar">
    <div id="tabs"></div>
    <button id="back" title="Назад">←</button>
    <button id="reload" title="Обновить">⟳</button>
    <span id="status">…</span>
    <a id="logout" href="/logout" title="Выйти">Выйти</a>
  </div>
  <div id="stage">
    <div id="player"></div>
    <div id="overlay" tabindex="0"></div>
  </div>
  <div id="toasts"></div>
  <div id="replaced">
    <div>
      <p>Браузер открыт на другом устройстве</p>
      <button id="take-over">Открыть здесь</button>
    </div>
  </div>
  <script src="/rrweb.js"></script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
